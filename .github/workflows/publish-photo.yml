name: Publish photo
# 13:00 India time: posts today's photo, unless the owner wrote "stop" on today's issue.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be posted'
        type: boolean
        default: true
      date:
        description: 'Date (YYYY-MM-DD), empty for today'
        required: false
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      POST_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q cryptography
      - run: sh tools/data.sh get
      - run: python3 autopilot/publish.py photo
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - if: always()
        run: sh tools/data.sh save
